# §8 — build y deploy del sitio estático.
#
# Con SSG una actividad nueva no existe hasta que se rebuildea. La Function
# `dispararRebuild` manda un `repository_dispatch` cada vez que hay cambios
# pendientes (con debounce de 5 minutos), y eso arranca este workflow.
name: Build y deploy del sitio

on:
  # Lo que dispara la Function del §8. El `event_type` tiene que coincidir con
  # el que manda `functions/index.js`.
  repository_dispatch:
    types: [rebuild]
  # A mano, desde la pestaña Actions. Sirve para probar el workflow sin tocar
  # Firestore, y para republicar después de un cambio de código.
  workflow_dispatch:
    inputs:
      # **B-1140 — el botón para probar el aviso sin esperar a que algo se
      # rompa.** El envío también se puede correr a mano
      # (`scripts/mail-de-aviso.sh`), pero eso obliga a tener la contraseña de
      # aplicación en la terminal; desde acá sale con los secrets que ya están
      # cargados y sin que nadie la toque.
      #
      # Un aviso que nunca se probó es un aviso que no existe: se descubre roto
      # el día que hacía falta, que es exactamente lo que pasó con el mecanismo
      # anterior (B-883, quince corridas rojas sin que nadie se enterara).
      probar_aviso:
        description: 'Mandar un mail de prueba y NO publicar el sitio'
        type: boolean
        default: false

# Un deploy a la vez. Si mientras corre uno llega otro dispatch, el que está a
# medias se cancela: el build nuevo lee los mismos datos y además los más
# frescos, así que terminar el viejo solo retrasa el resultado bueno.
concurrency:
  group: deploy-produccion
  cancel-in-progress: true

# Este workflow no escribe nada en el repo.
permissions:
  contents: read

jobs:
  deploy:
    name: Build y deploy
    # Con `probar_aviso` no se publica nada: la corrida existe solo para mandar
    # el mail. `inputs` no existe en un `repository_dispatch` —ahí es `null`—
    # así que el rebuild automático entra siempre por acá.
    if: ${{ !inputs.probar_aviso }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Motivo del rebuild
        # El motivo lo manda la Function en el client_payload ("actividad X",
        # "opciones/tags"). Queda en el log para poder correlacionar un run con
        # la edición que lo causó.
        #
        # El valor entra por `env:` y NO interpolado en el cuerpo del script.
        # Dos motivos, los dos del §5 (B-195):
        #
        # 1. `motivo` sale de Firestore, así que es texto que no controlamos, y
        #    `${{ }}` dentro de `run:` se pega en el script ANTES de que exista
        #    la shell: un valor con comillas o `$(...)` ejecuta lo que quiera en
        #    un job que más abajo recibe `FIREBASE_SERVICE_ACCOUNT`. Por `env:`
        #    llega como variable y la shell no lo reinterpreta.
        # 2. Los logs de Actions de un repo público los lee cualquiera, así que
        #    esto es una salida pública más. El motivo tiene que ser una
        #    etiqueta opaca (`actividad <id>`, `opciones/<campo>`) y nunca el
        #    título, que puede ser de un borrador.
        #
        # Y sigue en `run: |` y no en una línea: el texto lleva "Motivo:" y un
        # `: ` dentro de un escalar sin comillas hace que YAML lea un mapa
        # anidado. Eso rompía el archivo entero y **dejaba este workflow sin
        # triggers** — ver B-188 y la trampa 11. Lo cubre `tests/workflows.test.ts`.
        env:
          MOTIVO: ${{ github.event.client_payload.motivo || 'disparo manual' }}
        run: |
          echo "Motivo: $MOTIVO"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Igual que las Functions y el entorno local.
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        # Los tests de integración se saltean solos si no hay emuladores
        # (`describe.skipIf`), así que acá corre la lógica pura.
        #
        # **Y este paso corre ANTES del build, así que acá no hay `dist/`.** No es
        # un descuido —el build necesita la key y tarda, y no vale la pena
        # hacerlo si la lógica no pasa— pero sí es un hecho del que algo dependía
        # sin saberlo: dos chequeos sobre el artefacto vivían como tests y se
        # salteaban en silencio justo acá (B-873). Todo lo que mire `dist/` va en
        # el paso «Verificar el artefacto», más abajo.
        #
        # Si algo falla, el job falla y no se deploya: es preferible dejar el
        # sitio con los datos de ayer que publicar una proyección rota (§5.1).
        run: npm test

      - name: Que toda taxonomía declarada exista en la base
        # **B-1139 — este chequeo estaba solo en `push-main.yml`, y ésta es la
        # mitad que faltaba.** Decisión del dueño: que el rebuild **no publique**
        # hasta que el dato esté.
        #
        # El 2026-09-17 entró `tipo-biblioteca` y nadie la sembró en producción.
        # El deploy por `push` se puso rojo y lo dijo; **este workflow siguió
        # publicando un día entero**, porque es el que corre solo cada vez que
        # alguien toca una actividad y no miraba producción. O sea que el único
        # chequeo del pipeline que puede ver un vocabulario faltante no cubría el
        # camino que más publica — y encima el rojo del `push` se lee como «no se
        # publicó» cuando el sitio sí se estaba publicando.
        #
        # ── Lo que cuesta, dicho ───────────────────────────────────────
        # Con esto, **un dato que falta en producción frena la publicación de
        # todo lo que se cargó**, y este workflow corre desatendido. Se aceptó a
        # cambio de no publicar en silencio un sitio con los desplegables en
        # blanco, y el costo está acotado por dos cosas: el aviso por mail sale
        # solo cuando este job falla (B-1140), y sembrar es un comando
        # (`npm run opciones:sembrar:prod`).
        #
        # Va **antes del Build** por lo mismo que en `push-main.yml`: el build no
        # falla ante un vocabulario faltante —lee `snap.data()?.valores ?? []`—
        # así que publicaría los chips vacíos en verde.
        #
        # Es de solo lectura: no siembra. Escribir en producción desde un job
        # desatendido es otra decisión, y lo que falta no siempre es sembrar.
        run: node scripts/taxonomias-en-produccion.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Build
        # `astro build` lee Firestore con el Admin SDK (§2.4) y produce el HTML
        # de las páginas de detalle y el `events.json`.
        run: npm run build
        env:
          # §5.4 — la service account key NUNCA va al repo. Viaja como secret y
          # solo existe en la memoria de este runner.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verificar el artefacto (credencial afuera, App Check adentro, HTML limpio)
        # Trampa 4 / §5.4: si `firebase-admin` se cuela en un componente
        # cliente, la key termina en el bundle público. Falla cerrado, porque
        # publicar la key es irreversible.
        #
        # **Y desde B-873 el script también barre el HTML construido**: ningún
        # comentario de plantilla emitido como texto (B-261) y ningún host de
        # tercero contactado antes del consentimiento (D-254). Eso está acá y no
        # en `npm test` porque acá —y solo acá— existe `dist/`, y es el mismo
        # `dist/` que el paso siguiente sube a Hosting.
        #
        # **El script y no una copia del `grep` acá** (B-195). Estaba duplicado
        # en YAML y la copia ya había divergido: le faltaba la guarda final del
        # script —que `dist/` tenga al menos un `.js`—, así que un build vacío
        # pasaba el gate habiendo verificado nada. Es exactamente lo que la
        # cabecera de `verificar-bundle.sh` advertía que iba a pasar, y encima
        # este workflow es el que publica datos (§8) y B-189 describe el build
        # que produce un `dist/` sin contenido.
        run: ./scripts/verificar-bundle.sh dist

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # Mismo secret que el build: la service account necesita leer
          # Firestore y desplegar Hosting, nada más.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: agenda-literaria
          # `live` es el canal de producción. Sin esto sube a un canal de
          # preview con URL temporal.
          channelId: live
  # ───────────────────────────────────────────────────────────────
  # **El aviso va por MAIL, y hasta el 2026-09-18 iba por un issue** — B-1140,
  # decisión del dueño. Conviene saber qué se cambió, porque el issue no estaba
  # ahí por comodidad.
  #
  # El 2026-09-11 este workflow falló quince corridas seguidas y nadie se enteró:
  # el dueño cargó actividades, las publicó, y se dio cuenta de que no aparecían
  # mirando el sitio. B-883 verificó **contra la API** por qué el aviso nativo de
  # GitHub no alcanzaba, y las tres razones siguen siendo ciertas:
  #
  #   1. GitHub avisa de una corrida **solo a quien la disparó**, y de a un
  #      destinatario: el repo no elige cuál.
  #   2. Acá ese destinatario es quien posee el PAT que usa `dispararRebuild`
  #      (§8), o sea que el aviso viaja atado a una credencial de Secret Manager.
  #   3. Llega como `ci_activity` a la bandeja **web**; el mail de Actions es un
  #      opt-in por cuenta que el repo no puede ver ni configurar.
  #
  # El issue resolvía las tres. Lo que no resolvía es que **hay que ir a mirarlo**,
  # y eso fue lo que decidió el cambio: «si algo falla necesitamos saber».
  #
  # ── Qué se pierde, dicho y no descubierto después ──────────────────────
  # El issue **se cerraba solo** cuando el sitio volvía a publicar, así que «hay
  # un issue abierto» significaba «ahora mismo está atrasado». Un mail no se
  # cierra. Por eso hay un segundo job que avisa **cuando vuelve a publicar**: sin
  # él, el último mail que queda en la casilla dice que está roto aunque ya no lo
  # esté.
  #
  # ── Sin actions de terceros ────────────────────────────────────────────
  # El mail sale con `curl` al SMTP, que está en el runner. Una action de
  # terceros acá recibiría las credenciales del correo, y eso es superficie que
  # este aviso no necesita.
  #
  # ── Y se puede probar sin esperar a que algo se rompa ───────────────────
  # El envío vive en `scripts/mail-de-aviso.sh` y se corre a mano:
  #
  #     MAIL_AVISOS_DESTINO=… MAIL_AVISOS_USUARIO=… MAIL_AVISOS_PASSWORD=… \
  #       ./scripts/mail-de-aviso.sh 'Prueba' 'Si esto llega, funciona.'
  #
  # Un aviso que nunca se probó es un aviso que no existe: se descubre roto el
  # día que hacía falta, que es justo lo que pasó con el mecanismo anterior.
  # ───────────────────────────────────────────────────────────────
  avisar:
    name: Avisar por mail que el sitio quedó atrasado
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Un rojo de este job no puede tapar al rojo de verdad (punto 3 de B-883).
    # Va en el job Y en el paso, y el script de envío nunca devuelve error: son
    # tres cinturones a propósito, porque el modo de falla que se evita es
    # justamente «el aviso rompió lo que venía a avisar».
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # El checkout es por `scripts/mail-de-aviso.sh`. Hace falta un archivo, no
      # la historia.
      - uses: actions/checkout@v4
      - name: Mandar el mail
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOMBRE_WORKFLOW: ${{ github.workflow }}
          MAIL_AVISOS_DESTINO: ${{ secrets.MAIL_AVISOS_DESTINO }}
          MAIL_AVISOS_USUARIO: ${{ secrets.MAIL_AVISOS_USUARIO }}
          MAIL_AVISOS_PASSWORD: ${{ secrets.MAIL_AVISOS_PASSWORD }}
        # **El `motivo` del rebuild NO entra acá, y es a propósito.** Es texto
        # que sale de Firestore (§5): puede traer el título de un borrador que
        # todavía no es público. Y no hace falta — la pregunta que el aviso
        # contesta no es «qué edición disparó ESTA corrida» sino «desde cuándo el
        # sitio está atrasado», que sale de la última corrida verde.
        run: |
          set -uo pipefail

          # ── Desde cuándo el sitio está atrasado ────────────────────────
          # Las canceladas no cuentan: `cancel-in-progress` corta la corrida a
          # medias cada vez que llega un dispatch nuevo, y eso es lo normal.
          CUANDO='no se pudo averiguar'
          ROJAS='?'
          ID_WORKFLOW=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.workflow_id') || ID_WORKFLOW=''
          if [ -n "$ID_WORKFLOW" ]; then
            HISTORIAL=$(gh api "repos/$GH_REPO/actions/workflows/$ID_WORKFLOW/runs?per_page=50" \
              --jq '[.workflow_runs[]
                     | select(.conclusion == "success" or .conclusion == "failure")
                     | {c: .conclusion, t: .updated_at}]') || HISTORIAL=''
            if [ -n "$HISTORIAL" ]; then
              ROJAS=$(printf '%s' "$HISTORIAL" | jq '[.[].c] | (index("success") // length)')
              DESDE=$(printf '%s' "$HISTORIAL" | jq -r '[.[] | select(.c == "success")][0].t // ""')
              if [ -n "$DESDE" ]; then
                # §14 — la zona del proyecto y no la del runner: leer un instante
                # en la zona equivocada es la trampa 1.
                CUANDO=$(printf '%s' "$DESDE" | TZ='America/Argentina/Buenos_Aires' jq -Rr \
                  'strptime("%Y-%m-%dT%H:%M:%SZ") | mktime | strflocaltime("%d/%m/%Y %H:%M")' \
                  2>/dev/null || printf '%s' "$DESDE")
              else
                CUANDO='no hay ninguna corrida verde en las ultimas 50'
              fi
            fi
          fi

          PASO=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name][0] // ""') || PASO=''
          [ -n "$PASO" ] || PASO='no se pudo averiguar'

          ASUNTO='Agenda LEH: el sitio no se esta publicando'
          CUERPO=$(cat <<TEXTO
          El workflow "$NOMBRE_WORKFLOW" viene fallando y el sitio quedo atrasado:
          lo que se cargo desde entonces no esta publicado.

          Ultima publicacion correcta: $CUANDO
          Corridas rojas seguidas: $ROJAS
          Paso que se rompio: $PASO

          La corrida: $RUN_URL

          Cuando vuelva a publicar va a llegar otro mail diciendolo. Si no llega,
          sigue roto.

          Aviso automatico del repo (B-1140).
          TEXTO
          )

          ./scripts/mail-de-aviso.sh "$ASUNTO" "$CUERPO"
          exit 0

  # Y la otra mitad: sin esto, el último mail de la casilla dice que el sitio
  # está roto aunque ya haya vuelto a publicar. El issue se cerraba solo; un
  # mail no, así que el «volvió» hay que mandarlo.
  #
  # **Solo si la corrida anterior fue roja**, que es lo que lo hace un aviso y no
  # ruido: sin esa condición llegaría un mail por cada rebuild, o sea uno cada
  # vez que alguien toca una actividad — y un aviso que se aprende a ignorar no
  # avisa, que es el mismo argumento por el que el issue se reusaba.
  avisar-recuperado:
    name: Avisar que volvió a publicar
    needs: [deploy]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Acá el `continue-on-error` es todavía más importante que en `avisar`: sin
    # él, un fallo mandando el mail pondría en rojo una corrida que **sí
    # publicó**, y el rojo diría exactamente lo contrario de lo que pasó.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Mandar el mail, si venía roto
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_AVISOS_DESTINO: ${{ secrets.MAIL_AVISOS_DESTINO }}
          MAIL_AVISOS_USUARIO: ${{ secrets.MAIL_AVISOS_USUARIO }}
          MAIL_AVISOS_PASSWORD: ${{ secrets.MAIL_AVISOS_PASSWORD }}
        run: |
          set -uo pipefail

          ID_WORKFLOW=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.workflow_id') || ID_WORKFLOW=''
          if [ -z "$ID_WORKFLOW" ]; then
            echo "::warning::no se pudo leer la corrida; no se avisa la recuperacion"
            exit 0
          fi

          # La conclusión de la corrida anterior de este mismo workflow, sin
          # contar la actual ni las canceladas.
          ANTERIOR=$(gh api "repos/$GH_REPO/actions/workflows/$ID_WORKFLOW/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)
                   | select(.conclusion == \"success\" or .conclusion == \"failure\")][0].conclusion // \"\"") \
            || ANTERIOR=''

          if [ "$ANTERIOR" != 'failure' ]; then
            echo "::notice::la corrida anterior no fue roja: no hay nada que avisar"
            exit 0
          fi

          CUERPO=$(cat <<TEXTO
          El deploy volvio a salir bien: lo que estaba sin publicar ya esta en el sitio.

          La corrida: $RUN_URL
          TEXTO
          )

          ./scripts/mail-de-aviso.sh 'Agenda LEH: el sitio volvio a publicarse' "$CUERPO"
          exit 0

  # ───────────────────────────────────────────────────────────────
  # **Probar el aviso** — B-1140. Actions → «Build y deploy del sitio» → «Run
  # workflow» → tildar «Mandar un mail de prueba».
  #
  # **Este job SÍ se pone rojo si el mail no sale**, y es la diferencia con los
  # dos de arriba. Aquéllos no pueden agregar su propio rojo a una corrida que
  # venía a avisar de otra cosa (punto 3 de B-883); éste **es** la corrida, y un
  # verde que no manda nada sería la prueba mintiendo — exactamente lo que viene
  # a descartar.
  # ───────────────────────────────────────────────────────────────
  probar-aviso:
    name: Probar el aviso por mail
    if: ${{ inputs.probar_aviso }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Mandar un mail de prueba
        env:
          MAIL_AVISOS_DESTINO: ${{ secrets.MAIL_AVISOS_DESTINO }}
          MAIL_AVISOS_USUARIO: ${{ secrets.MAIL_AVISOS_USUARIO }}
          MAIL_AVISOS_PASSWORD: ${{ secrets.MAIL_AVISOS_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          CUERPO=$(cat <<TEXTO
          Esto es una prueba, pedida a mano desde Actions.

          Si llego, el aviso de "el sitio no se esta publicando" tambien va a
          llegar cuando haga falta.

          La corrida: $RUN_URL
          TEXTO
          )

          SALIDA=$(./scripts/mail-de-aviso.sh 'Agenda LEH: prueba del aviso' "$CUERPO" 2>&1)
          printf '%s\n' "$SALIDA"

          # El script nunca devuelve error —no puede tumbar la corrida que avisa—
          # así que acá se mira lo que dijo. En una prueba, «no se pudo mandar»
          # tiene que ser rojo: un verde que no manda nada es la prueba mintiendo.
          case "$SALIDA" in
            *'aviso mandado'*) echo "::notice::el mail salio: revisa la casilla" ;;
            *) echo "::error::el mail NO salio"; exit 1 ;;
          esac
