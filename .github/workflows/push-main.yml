# Deploy de código: un push a main publica lo que haga falta y nada más.
#
# Es distinto de `deploy.yml`, que es el deploy de DATOS (§8): ese lo dispara la
# Function cuando cambia una actividad y solo republica el sitio. Este se
# dispara por código y puede tocar Hosting, las reglas de Firestore y las
# Functions.
#
# El gate son los tests. Si algo falla no se deploya nada: es preferible dejar
# producción como está que publicar algo roto.
name: Deploy desde main

on:
  push:
    branches: [main]
    # Los tags los crea este mismo workflow; sin esto, crear el tag dispararía
    # otra corrida que no aporta nada.
    tags-ignore: ['**']
  workflow_dispatch:
    inputs:
      forzar_todo:
        description: 'Deployar todo sin mirar qué cambió'
        type: boolean
        default: false

# Un deploy de código a la vez, y NO se cancela a mitad de camino. A diferencia
# del rebuild de datos —donde un build superseded no aporta nada— acá cancelar
# puede dejar las Functions a medio desplegar.
concurrency:
  group: deploy-codigo-produccion
  cancel-in-progress: false

permissions:
  # Para crear el tag cuando cambia la versión.
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────
  # Qué hay que deployar. Se decide una vez y lo usan los tres jobs.
  # ───────────────────────────────────────────────────────────────
  decidir:
    name: Qué deployar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hosting: ${{ steps.q.outputs.hosting }}
      functions: ${{ steps.q.outputs.functions }}
      firestore: ${{ steps.q.outputs.firestore }}
      storage: ${{ steps.q.outputs.storage }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Hacen falta los dos commits para poder diffear.
          fetch-depth: 0

      - name: Qué archivos cambiaron
        id: q
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          FORZAR: ${{ inputs.forzar_todo }}
        run: |
          set -euo pipefail

          if [ "${FORZAR:-false}" = "true" ]; then
            printf 'hosting=true\nfunctions=true\nfirestore=true\nstorage=true\n' >> "$GITHUB_OUTPUT"
            echo "::notice::se deploya todo (pedido manual)"; exit 0
          fi

          # B-205 — diffear contra lo PUBLICADO, no contra el push anterior.
          #
          # `github.event.before` es el head del push previo. Si esa corrida no
          # llegó a deployar nada (falló al arrancar, se canceló, GitHub
          # Actions tuvo un `major_outage`), el push siguiente diffea desde un
          # commit que YA está en `main` pero nunca se publicó — y esos
          # cambios quedan fuera del diff para siempre, sin ningún síntoma de
          # este lado. La decisión de contra qué commit diffear vive en un
          # script (`scripts/commit-base-deploy.sh`) para poder testearla, con
          # la misma razón que `que-deployar.sh`: un `if` en YAML no se puede
          # probar hasta que ya deployó mal.
          eval "$(./scripts/commit-base-deploy.sh)"
          if [ -n "$ANTES" ] && [ "$ANTES" != "${EVENT_BEFORE:-}" ]; then
            echo "::notice::se diffea contra lo publicado ($ANTES), no contra el push anterior"
          fi

          # Primer push, force-push, o base inaccesible: no se puede saber
          # qué cambió, así que se deploya todo. Falla hacia el lado de
          # deployar: quedarse corto deja producción con código viejo en
          # silencio, que es peor que un deploy de más.
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            printf 'hosting=true\nfunctions=true\nfirestore=true\nstorage=true\n' >> "$GITHUB_OUTPUT"
            echo "::notice::se deploya todo (no se puede diffear contra ningún commit anterior)"; exit 0
          fi

          CAMBIOS=$(git diff --name-only "$ANTES" "${{ github.sha }}")
          echo "Archivos cambiados:"; printf '%s\n' "$CAMBIOS" | sed 's/^/  /'

          # La decisión vive en un script para poder testearla:
          # tests/que-deployar.test.ts le pasa listas de archivos y verifica el
          # resultado. Un `if` en YAML no se puede probar hasta que ya deployó
          # mal.
          DECISION=$(printf '%s\n' "$CAMBIOS" | ./scripts/que-deployar.sh)
          printf '%s\n' "$DECISION" | tee -a "$GITHUB_OUTPUT"
          echo "::notice::$(printf '%s' "$DECISION" | tr '\n' ' ')"

  # ───────────────────────────────────────────────────────────────
  # El gate. Corre siempre, incluso si no hay nada que deployar.
  # ───────────────────────────────────────────────────────────────
  verificar:
    name: Tests y typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      # Los emuladores de Firebase necesitan JDK 21+.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - run: npm ci

      - name: Preparar tipos de Astro
        # `tsc` necesita `.astro/types.d.ts`, que lo genera este comando.
        run: npx astro sync

      - run: npx tsc --noEmit

      - name: Tests, con emuladores
        # `EXIGIR_EMULADOR=1` hace que los tests de integración FALLEN en vez de
        # saltearse si el emulador no responde. Sin eso, `npm test` en un runner
        # sin emuladores da verde salteando 33 tests en silencio, y un cambio a
        # `firestore.rules` se deployaría sin que nadie las pruebe — que es
        # exactamente lo que este workflow habilita.
        #
        # B-167 — `storage` entra en la lista por el mismo motivo: desde que hay
        # `storage.rules`, este workflow también las deploya.
        #
        # **Este job no buildea, así que acá no hay `dist/`.** El build es el job
        # `hosting`, en otro runner. Un test que mire el artefacto se saltea acá
        # en silencio y nadie se entera: es B-873, y por eso esos chequeos viven
        # en `scripts/verificar-bundle.sh`, que corre después del build.
        env:
          EXIGIR_EMULADOR: '1'
        run: |
          # **El `--project` tiene que ser el MISMO que usan los tests** (B-219,
          # B-894). `vitest.config.ts` inyecta `PUBLIC_FIREBASE_PROJECT_ID` con el
          # id derivado del checkout (`agenda-literaria-<huella>`), no con
          # `agenda-literaria`. Con el emulador levantado en otro proyecto, los
          # claims puestos con `setCustomUserClaims` —y el `email` /
          # `email_verified` del registro— **no llegan al token**: el emulador de
          # Auth los busca en el proyecto que arrancó y ahí la cuenta no existe.
          # Todo lo que la regla NIEGA sigue dando verde; lo que OTORGA se cae. O
          # sea que el desajuste rompe exactamente los controles positivos y deja
          # pasar los negativos, que es la peor mitad para perder.
          #
          # Se derivaba bien en `scripts/verificar-todo.sh` desde B-219 y acá
          # estaba cableado a mano. Lo ata `tests/guardas-de-los-scripts.test.ts`.
          npx firebase emulators:exec --only auth,firestore,storage \
            --project "$(node scripts/project-id-emulador.mjs)" 'npm test'

  # ───────────────────────────────────────────────────────────────
  # Reglas primero: si el panel nuevo escribe campos que las reglas viejas
  # rechazan, el orden inverso deja una ventana de escrituras fallidas.
  # ───────────────────────────────────────────────────────────────
  firestore:
    name: Reglas e índices
    needs: [decidir, verificar]
    # B-167 — las reglas de Storage van en este mismo job y no en uno propio: es
    # el job «las reglas», y separarlo duplicaría el checkout, el `npm ci` y el
    # manejo de la key para deployar un archivo. El `--only` se arma abajo con lo
    # que haya cambiado.
    if: needs.decidir.outputs.firestore == 'true' || needs.decidir.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          DEPLOY_FIRESTORE: ${{ needs.decidir.outputs.firestore }}
          DEPLOY_STORAGE: ${{ needs.decidir.outputs.storage }}
        run: |
          set -euo pipefail
          TARGETS=''
          [ "$DEPLOY_FIRESTORE" = 'true' ] && TARGETS='firestore:rules,firestore:indexes'
          if [ "$DEPLOY_STORAGE" = 'true' ]; then
            TARGETS="${TARGETS:+$TARGETS,}storage"
          fi
          echo "targets: $TARGETS"
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx firebase deploy --only "$TARGETS" \
            --project agenda-literaria --non-interactive
          rm -f /tmp/sa.json

  hosting:
    name: Sitio y panel
    needs: [decidir, verificar, firestore]
    # `always()` porque `firestore` se saltea cuando no cambiaron las reglas, y
    # un job salteado haría que este también se saltee.
    if: |
      always() && needs.decidir.outputs.hosting == 'true'
      && needs.verificar.result == 'success'
      && needs.firestore.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # La versión del panel lleva el SHA corto del commit: sin el historial
          # el script no puede leerlo y el build queda sellado como "sin-git".
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      - name: Build
        run: npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verificar el artefacto (credencial afuera, App Check adentro, HTML limpio)
        # El mismo script que `deploy.yml`. Y el único lugar de este workflow
        # donde existe un `dist/`: los tests son el job `verificar`, que corre en
        # otro runner y no buildea nunca. Todo chequeo sobre el artefacto va acá
        # — es lo que B-873 dejó escrito, después de dos que no corrían.
        run: ./scripts/verificar-bundle.sh dist

      - name: Que la versión del build sea la del commit
        # Si el árbol del runner quedara sucio, la versión saldría sellada como
        # "-sucio" y el panel se recargaría solo sin motivo.
        run: |
          V=$(node -p "require('./dist/version.json').version")
          echo "versión publicada: $V"
          case "$V" in
            *-sucio*|*sin-git*)
              echo "::error::la versión quedó como «$V»: el build no salió de un commit limpio"
              exit 1;;
          esac

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: agenda-literaria
          channelId: live

  functions:
    name: Cloud Functions
    needs: [decidir, verificar, hosting]
    if: |
      always() && needs.decidir.outputs.functions == 'true'
      && needs.verificar.result == 'success'
      && needs.hosting.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx firebase deploy --only functions --project agenda-literaria --non-interactive
          rm -f /tmp/sa.json

  # ───────────────────────────────────────────────────────────────
  # Los tags. **Dos por deploy y no uno**, y son de distinta naturaleza —
  # pedido del dueño el 2026-09-07: «cada push que hacemos tiene que generar un
  # tag y version».
  #
  # Antes acá se creaba un tag **solo** cuando cambiaba `version` en el
  # `package.json`, o sea cuando una persona decidía que eso era una versión. El
  # pedido es lo contrario y tiene un motivo concreto detrás: el dueño quería
  # poder señalar exactamente qué se publicó cuando alguien reporta un problema.
  #
  # Lo que ya funcionaba y conviene no confundir: **la versión del panel ya
  # cambia en cada push**. `scripts/version.mjs` la compone como
  # `1.9.0+<sha corto>`, así que el `/version.json` de producción y el bundle que
  # corre en el navegador se distinguen commit por commit — es lo que hace que la
  # detección de «pestaña vieja» funcione. Lo que faltaba era el **tag**: la
  # versión existía y no se podía escribir `git show` de ella.
  #
  # Por eso hay dos:
  #
  #   v1.9.0+a1b2c3d  — el deploy. Uno por push, y es EXACTAMENTE la cadena que
  #                     el panel muestra y que un reporte de bug copia. Liviano
  #                     (`git tag` sin `-a`): son muchos y no llevan mensaje.
  #   v1.9.0          — la versión, cuando `package.json` cambia. Anotado, con
  #                     mensaje, como hasta hoy. Es el que sirve para leer el
  #                     historial: `git tag --list 'v*.*.*'` los da sin el ruido
  #                     de los de deploy, porque los otros llevan `+`.
  #
  # El `+` es legal en un nombre de ref (lo que git prohíbe es el espacio, `~`,
  # `^`, `:`, `?`, `*`, `[`, `\`, `..` y `@{`), y es el separador que semver
  # define para metadata de build — o sea que el tag se llama igual que la
  # versión, sin traducción de nadie.
  # ───────────────────────────────────────────────────────────────
  etiquetar:
    name: Tags del deploy
    needs: [verificar, hosting, functions, firestore]
    if: always() && needs.verificar.result == 'success' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag del deploy, y el de la versión si es nueva
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # La cadena la compone `scripts/version.mjs` y NADIE MÁS (B-88, D-98):
          # si acá se armara a mano, el tag y lo que dice el panel se separarían
          # en el primer cambio de formato.
          VERSION=$(node -e "import('./scripts/version.mjs').then((m) => console.log(m.infoVersion().version))")
          BASE="v$(node -p "require('./package.json').version")"
          DEPLOY="v$VERSION"

          # Un árbol sucio en el runner sellaría la versión como «-sucio» y el tag
          # quedaría con basura. El job `verificar` ya lo corta para el build; acá
          # se vuelve a chequear porque este job no depende de ese artefacto.
          case "$VERSION" in
            *-sucio*|*sin-git*)
              echo "::error::la versión salió «$VERSION»: no hay commit limpio del que colgar el tag"
              exit 1;;
          esac

          # ── El tag del deploy: uno por push ──────────────────────────
          if git rev-parse -q --verify "refs/tags/$DEPLOY" >/dev/null; then
            echo "::notice::$DEPLOY ya existe (re-run del mismo commit), no se toca"
          else
            git tag "$DEPLOY"
            git push origin "$DEPLOY"
            echo "::notice::tag de deploy $DEPLOY creado"
          fi

          # ── El de la versión: solo cuando la movió una persona ───────
          if git rev-parse -q --verify "refs/tags/$BASE" >/dev/null; then
            echo "::notice::$BASE ya existe, no se toca"
          else
            git tag -a "$BASE" -m "Versión ${BASE#v} — desplegada desde ${{ github.sha }}"
            git push origin "$BASE"
            echo "::notice::tag de versión $BASE creado"
          fi
