<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<title>Agenda LEH - Leer, Escribir, Hacer</title>
<!-- Fuentes: Archivo Narrow (label-caps, headline-md) · Bodoni Moda (display-lg) · Public Sans (body) -->
<!-- Tokens de color de Stitch (Material 3): primary #a7341c · surface #fbf9f4 · on-surface #1b1c19
     tertiary #6c575a · outline #8c716b · tertiary-fixed #f9dbdf · secondary-fixed #d2e4fb
     surface-container-low #f5f3ee · surface-container-highest #e4e2dd · outline-variant #e0bfb9 -->
<!-- Escala tipográfica:
     display-lg      Bodoni Moda 72px/64px  tracking -0.02em  peso 800
     display-lg-mob  Bodoni Moda 48px/44px  tracking -0.01em  peso 800
     headline-md     Archivo Narrow 32px/32px peso 700
     label-caps      Archivo Narrow 11px/12px tracking 0.05em peso 600 UPPERCASE
     body-md         Public Sans 14px/18px
     body-sm         Public Sans 12px/16px
     Espaciado: baseline 4px · margin-desktop 40px · margin-mobile 16px · gutter 16px -->
</head>
<body>
<!-- ENCABEZADO: sticky. "Agenda LEH" en display-lg primary UPPERCASE tracking-tighter.
     Nav a la derecha en label-caps; el activo con borde inferior de 2pt.
     Debajo, una regla de 0.5pt y la bajada "Leer, Escribir, Hacer" centrada en label-caps tracking-widest. -->

<!-- CUERPO: dos columnas. Aside izquierdo sticky de 256px con fondo surface-container-low
     y borde derecho de 0.5pt: título "Filtros" en headline-md y debajo "Índice de contenidos"
     en label-caps. Lista de ejes (Tipo · Cuándo · Dónde · Arancel · Modalidad), cada uno una
     fila con separador de 0.5pt; el activo va con fondo primary, texto on-primary y
     translate-x-1. -->

<!-- CANVAS: h1 en headline-md, "Talleres, clubes de lectura y encuentros literarios en Argentina".
     Marcador de mes: "SEPTIEMBRE" en display-lg primary UPPERCASE, con borde inferior de 2pt. -->

<!-- CADA ENTRADA es una fila de grilla de 12 columnas, NO una tarjeta:
       col 1-3   fecha en label-caps tracking-widest + el tipo en una cajita con borde 0.5pt
       col 4-9   título en headline-md (hover: primary) + una línea de metadatos en body-md
       col 10-12 el arancel en una cajita con fondo, alineada a la derecha
     Separador inferior de 0.5pt entre filas; la última con 2pt. Hover: fondo surface-container-low. -->

<!-- Ejemplos renderizados:
     jue 4 sep, 19h        · taller           · Escribir la ciudad                              · Casa Brandon, Villa Crespo · a la gorra
     ciclo de 4, empieza…  · club de lectura  · Bolaño en cuatro encuentros                     · virtual                    · gratis
     vie 12 sep, 19.30h    · presentación     · Presentación: Las malas, de Camila Sosa Villada · Librería Hernández, Almagro· entrada libre
     sáb 20 y dom 21 sep   · feria            · Feria de editoriales independientes             · Parque Centenario          · gratis
     mié 24 sep, 18h       · taller           · Taller de poesía: el poema breve                · San Telmo                  · arancelado, 2 cuotas -->

<!-- PIE: fondo surface-container-highest, borde superior de 2pt. "Agenda LEH" en headline-md
     primary a la izquierda; en el medio el copyright y @librosdelatiahildita; a la derecha
     los enlaces en label-caps con subrayado decoration-primary. -->
</body></html>
